version: '3.9'

services:
  enterprise-sethu-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: enterprise-sethu-app:1.0.0
    container_name: enterprise-sethu-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
